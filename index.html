<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EJ Shoes</title>
  <meta name="description" content="EJ Shoes. Pick your size and colour, then order on WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="shoe" viewBox="0 0 300 140">
      <path d="M8 108H294V114Q294 130 276 130H28Q8 130 8 114Z" fill="#0f2233"/>
      <path d="M18 108L26 62Q29 40 52 38L92 34Q118 62 150 64L224 70Q270 77 286 106L290 108Z" fill="currentColor"/>
      <path d="M52 38Q58 12 98 14L114 22L92 34Z" fill="currentColor" opacity=".75"/>
      <path d="M96 44L112 56M112 40L128 54M128 38L144 52" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 96Q120 84 262 98" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    </symbol>
  </svg>

  <header class="top">
    <a class="brand" href="#top">EJ<span>Shoes</span></a>
    <nav>
      <a href="#top">Home</a>
      <a href="#featured">Featured</a>
      <a href="#catalog">Catalog</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="chat" id="chatLink" href="#">WhatsApp</a>
  </header>

  <section class="hero" id="top">
    <div class="stage"><span class="bigword" aria-hidden="true">EJ</span><div id="heroShoe"></div></div>
    <div class="info" id="heroInfo"></div>
  </section>

  <section class="featured" id="featured"><div class="cards" id="featCards"></div></section>

  <section class="catalog" id="catalog">
    <div class="filters">
      <label>Size <input type="range" id="fSize" min="2" max="12" value="2"><output id="oSize">Any</output></label>
      <label>Price <input type="range" id="fPrice" min="3000" max="15000" step="500" value="15000"><output id="oPrice"></output></label>
      <div class="fcolors" id="fColors" role="group" aria-label="Colour"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No shoes match. Change the size, price or colour.</p>
  </section>

  <footer id="contact">
    <div class="fcols">
      <div><h4>Visit EJ Shoes</h4><p id="addr"></p><p id="hours"></p></div>
      <div><h4>Order</h4><p id="phone"></p><p><a id="chatLink2" href="#">Message us on WhatsApp</a></p></div>
      <div><h4>Find us</h4><p><a id="mapLink" href="#">Google Maps</a></p><p><a id="fbLink" href="#">Facebook</a></p></div>
    </div>
    <p class="copy">© <span id="year"></span> EJ Shoes. Sample products and prices, replace with your own.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
